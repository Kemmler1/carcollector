<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House</title>
<link rel="stylesheet" href="style.css?v=__BUILD__">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<header id="titlebar">
  <nav id="menubar">
    <span class="app-name">House</span>
    <div class="menu"><button class="menu-title">File</button><div class="menu-items">
      <button data-click="btn-export">Export Package…<kbd>⌘E</kbd></button>
      <button data-click="btn-import">Import Version…<kbd>⌘I</kbd></button>
      <div class="menu-sep"></div>
      <button data-click="btn-download">Download Current Version JSON</button>
      <button data-click="btn-revert">Revert Plan Edits</button>
    </div></div>
    <div class="menu"><button class="menu-title">View</button><div class="menu-items">
      <button data-click="btn-iso">Reset View<kbd>R</kbd></button>
      <button data-click="btn-top">Top View<kbd>T</kbd></button>
      <button data-click="btn-plan">Floor Plan Editor<kbd>P</kbd></button>
      <button data-click="btn-walk">Walk Through<kbd>W</kbd></button>
      <div class="menu-sep"></div>
      <button data-toggle="toggle-roofs">Roofs</button>
      <button data-toggle="toggle-labels">Labels</button>
      <button data-toggle="toggle-markers">Photo Spots</button>
      <button data-toggle="toggle-wire">Wireframe</button>
    </div></div>
    <div class="menu"><button class="menu-title">Photos</button><div class="menu-items">
      <button data-click="btn-compare">Compare Photos with Model…<kbd>C</kbd></button>
      <button data-click="btn-onboard">Assign Photos…<kbd>A</kbd></button>
    </div></div>
    <div class="menu"><button class="menu-title">Versions</button><div class="menu-items" id="versions-menu">
      <button data-click="btn-diff">Diff vs Previous…</button>
      <div class="menu-sep"></div>
    </div></div>
    <div class="menu"><button class="menu-title">Help</button><div class="menu-items">
      <button data-click="btn-help">Keyboard Shortcuts</button>
      <a href="../README.md" target="_blank">Project README</a>
    </div></div>
  </nav>
  <div id="toolbar">
    <span id="version-label"></span>
    <span class="spacer"></span>
    <div class="segmented" id="view-seg">
      <button data-click="btn-iso" class="active">3D</button><button data-click="btn-plan">Plan</button><button data-click="btn-walk">Walk</button><button data-click="btn-compare">Compare</button>
    </div>
    <button data-click="btn-export" class="primary">Export</button>
  </div>
  <div id="hidden-controls">
    <select id="version-select"></select>
    <input type="checkbox" id="toggle-wire"><input type="checkbox" id="toggle-roofs" checked><input type="checkbox" id="toggle-labels" checked><input type="checkbox" id="toggle-markers" checked>
    <button id="btn-top"></button><button id="btn-iso"></button><button id="btn-plan"></button><button id="btn-revert"></button><button id="btn-walk">Walk through</button><button id="btn-compare"></button><button id="btn-onboard"></button>
    <button id="btn-diff"></button><button id="btn-import"></button><button id="btn-export"></button><button id="btn-download"></button><button id="btn-help"></button>
  </div>
</header>

<main>
  <aside id="sidebar">
    <input id="filter" type="search" placeholder="Search">
    <div id="section-list"></div>
    <div id="general-comments">
      <h3>Notes</h3>
      <div id="general-comment-list" class="comment-list"></div>
      <form id="general-comment-form" class="comment-form">
        <textarea rows="2" placeholder="Add a note"></textarea>
        <button>Add</button>
      </form>
    </div>
  </aside>

  <div id="viewport">
    <div id="compare-bar" class="hidden">
      <button id="cmp-prev" title="Previous photo (←)">◀</button>
      <span id="cmp-title"></span>
      <button id="cmp-next" title="Next photo (→)">▶</button>
      <span class="sep"></span>
      <button id="cmp-mode-side" class="seg active">Side by side</button><button id="cmp-mode-overlay" class="seg">Overlay</button>
      <label id="cmp-opacity-wrap"><input type="range" id="cmp-opacity" min="0" max="100" value="50"> <span id="cmp-opacity-val">50%</span></label>
      <span class="sep"></span>
      <button id="cmp-goto">Go to Spot</button>
      <button id="cmp-save" class="primary">Save Spot</button>
      <button id="cmp-assign">Assign…</button>
      <button id="cmp-publish" title="Write your camera moves, notes and assignments to the repo for review">Publish changes</button>
      <button id="cmp-close">Done</button>
      <div id="cmp-note-row">
        <span id="cmp-shows" title="Parts this photo is assigned to (change with Assign…)"></span>
        <textarea id="cmp-note" rows="1" placeholder="Comment on this photo: what it shows or where it was taken from, e.g. “taken from the doorway into this room, looking at the bed” — goes into the export so the spot and assignment get fixed"></textarea>
        <span id="cmp-note-state"></span>
      </div>
    </div>
    <div id="plan-bar" class="hidden">
      <div class="segmented" id="plan-add">
        <button data-add="room">+ Room</button><button data-add="zone">+ Zone</button><button data-add="pergola">+ Pergola</button>
      </div>
      <select id="plan-prop-add"><option value="">+ Item…</option></select>
      <select id="plan-opening-add"><option value="">+ Door / window…</option></select>
      <span class="sep"></span>
      <label>Snap <select id="plan-snap"><option value="0.1">0.1 m</option><option value="0.25" selected>0.25 m</option><option value="0.5">0.5 m</option><option value="1">1 m</option><option value="0">Off</option></select></label>
      <label><input type="checkbox" id="plan-grid" checked> Grid</label>
      <span class="sep"></span>
      <span id="plan-sel" class="muted">Nothing selected</span>
      <span class="spacer"></span>
      <button id="plan-mirror">Mirror</button>
      <button id="plan-undo">Undo</button>
      <button id="plan-fit">Fit</button>
    </div>
    <div id="panes">
      <div id="plan" class="hidden"></div>
      <div id="compare-photo" class="hidden"><img alt=""></div>
      <div id="stage-wrap"><div id="stage"><canvas id="canvas"></canvas><img id="overlay-photo" class="hidden" alt=""><div id="spot-inset" class="hidden"><svg id="spot-svg"></svg><div id="spot-help">drag ● camera · ○ look-at · scroll zoom</div></div></div></div>
    </div>
    <div id="hint" class="muted"></div>
    <div id="place-banner" class="hidden"></div>
    <div id="walk-banner" class="hidden">W A S D · Shift · Q E · Esc</div>
  </div>

  <aside id="detail" class="hidden">
    <button id="detail-close" class="close" title="Close">×</button>
    <div id="detail-body"></div>
  </aside>

  <aside id="onboard" class="hidden">
    <button id="onboard-close" class="close" title="Close">×</button>
    <div id="onboard-body"></div>
  </aside>
</main>

<div id="modal" class="hidden">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="close" id="modal-close">×</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="lightbox" class="hidden">
  <img alt="">
  <div class="caption"></div>
  <div class="lb-actions"><button id="lb-view">Look from this spot in 3D</button><button id="lb-compare">Compare with 3D</button><button id="lb-assign">Assign this photo</button><button id="lb-close">Close</button></div>
</div>

<script type="module" src="app.js?v=__BUILD__"></script>
</body>
</html>
